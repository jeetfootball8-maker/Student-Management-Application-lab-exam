<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
            border: none;
        }

        .delete {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }

        #search {
            width: 90%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <h3>Add Student Details</h3>

    <form id="studentForm">
        <input id="sid" placeholder="Student ID" required>
        <input id="name" placeholder="Student Name" required>
        <input id="course" placeholder="Course" required>
        <input id="marks" type="number"
               placeholder="Marks (0-100)"
               min="0" max="100" required>
        <button type="submit">Add Student</button>
    </form>

    <input id="search" placeholder="Search by ID or name..."
           oninput="displayStudents()">

    <h3>Student Records</h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentList"></tbody>
    </table>

    <h3 id="total">Total Students: 0</h3>
    <h3 id="average">Average Marks: 0</h3>
</div>

<script>
    let students = [];

    const form = document.getElementById("studentForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        let id = document.getElementById("sid").value.trim();
        let name = document.getElementById("name").value.trim();
        let course = document.getElementById("course").value.trim();
        let marks = Number(document.getElementById("marks").value);

        if (students.some(s => s.id === id)) {
            alert("Student ID already exists!");
            return;
        }

        students.push({id, name, course, marks});
        form.reset();
        displayStudents();
    });

    function displayStudents() {
        let list = document.getElementById("studentList");
        let search = document.getElementById("search").value.toLowerCase();

        list.innerHTML = "";

        let filtered = students.filter(s =>
            s.id.toLowerCase().includes(search) ||
            s.name.toLowerCase().includes(search)
        );

        filtered.forEach(s => {
            let row = list.insertRow();

            [s.id, s.name, s.course, s.marks].forEach(value => {
                row.insertCell().textContent = value;
            });

            let cell = row.insertCell();
            let btn = document.createElement("button");

            btn.textContent = "Delete";
            btn.className = "delete";
            btn.onclick = () => {
                students = students.filter(x => x.id !== s.id);
                displayStudents();
            };

            cell.appendChild(btn);
        });

        document.getElementById("total").textContent =
            "Total Students: " + students.length;

        let avg = students.length
            ? students.reduce((sum, s) => sum + s.marks, 0) / students.length
            : 0;

        document.getElementById("average").textContent =
            "Average Marks: " + avg.toFixed(2);
    }
</script>

</body>
</html>
